name: Feature request
description: Suggest an improvement to EmailSmith
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and user experience.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you considered.
  - type: checkboxes
    id: impact
    attributes:
      label: Impact areas
      options:
        - label: This changes what personal data is stored or sent to a service.
        - label: This affects email-client compatibility.
        - label: This adds a dependency or increases browser bundle size.
        - label: This affects Vercel deployment or static-site behavior.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue or pull request covering this request.
          required: true
  - type: textarea
    id: agent_attribution
    attributes:
      label: AI attribution
      description: Leave this as is if you wrote the issue yourself.
      value: Not AI-generated
    validations:
      required: true
