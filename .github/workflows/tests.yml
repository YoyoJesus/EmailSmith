name: Tests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate commit messages
        run: >-
          node .github/scripts/check-commit-messages.mjs
          "${{ github.event.pull_request.base.sha }}"
          "${{ github.event.pull_request.head.sha }}"

      - name: Test repository policy validators
        run: node --test .github/scripts/check-agent-attribution.test.mjs

  test:
    name: Test and check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up Typst
        uses: typst-community/setup-typst@fee4b65b091cc546f02ce3be15fad8760f38a108 # v5.3.0
        with:
          typst-version: 0.14.2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          TYPST_REQUIRED: "1"

      - name: Run Svelte and TypeScript checks
        run: npm run check

      - name: Check formatting
        run: npm run lint

      - name: Build production application
        run: npm run build
